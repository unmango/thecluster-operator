name: CI

on:
  pull_request:
    branches: [main]

# Nothing here writes to the repository; checks and tests only read it.
permissions:
  contents: read

jobs:
  nix:
    runs-on: thecluster
    # The runner image ships nix, so nothing installs it here. Its
    # /etc/nix/nix.conf carries the settings every job wants, and nix merges
    # NIX_CONFIG on top of that file. Only extra-* settings, because a plain
    # assignment replaces the image's value rather than adding to it.
    env:
      NIX_CONFIG: |
        extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
        extra-substituters = https://ncps.thecluster.lan
        extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: nix flake check

  # The devshell supplies go, kind, kustomize, kubectl and the envtest
  # binaries from unmango/kubepkgs, so every job below runs inside it.
  test:
    runs-on: thecluster
    env:
      NIX_CONFIG: |
        extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
        extra-substituters = https://ncps.thecluster.lan
        extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: nix develop -c make test

      # manifests and generate rewrite the CRDs, RBAC and deepcopy code from the
      # Go types; a diff means the PR changed a type without regenerating.
      # git status rather than git diff, which says nothing about a file that
      # was generated but never added.
      - name: Check generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  lint:
    runs-on: thecluster
    env:
      NIX_CONFIG: |
        extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
        extra-substituters = https://ncps.thecluster.lan
        extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: nix develop -c make lint

  e2e:
    runs-on: thecluster
    env:
      NIX_CONFIG: |
        extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
        extra-substituters = https://ncps.thecluster.lan
        extra-experimental-features = nix-command flakes
      PIA_USER: ${{ secrets.PIA_USER }}
      PIA_PASS: ${{ secrets.PIA_PASS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: nix develop -c make kind-cluster
      - run: nix develop -c make test-e2e

  docker:
    runs-on: thecluster
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
