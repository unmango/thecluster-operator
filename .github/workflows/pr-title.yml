name: PR Title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  # PRs land as squash merges, so the PR title becomes the commit subject on
  # main. release-please parses those subjects; a title without a Conventional
  # Commits type never reaches a release.
  conventional-commits:
    runs-on: thecluster
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the changelog-sections in release-please-config.json, plus
          # the types that carry no changelog entry.
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
            deps
            style
          requireScope: false
          subjectPattern: ^[a-z](?:.*[^.])?$
          subjectPatternError: >
            The subject "{subject}" of "{title}" must start with a lowercase
            character and must not end with a period.
