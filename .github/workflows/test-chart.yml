name: Test Chart

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=cert-manager/cert-manager
  CERT_MANAGER_VERSION: 1.21.2

jobs:
  install:
    runs-on: thecluster
    env:
      NIX_CONFIG: |
        extra-trusted-public-keys = ncps.thecluster.lan:D8fcKW2/D+zjKOABa3bDjEe8x+EPZpXnBDm+XwtNrhI=
        extra-substituters = https://ncps.thecluster.lan
        extra-experimental-features = nix-command flakes
      IMG: thecluster-operator:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: nix develop -c make kind-cluster

      - name: Load image into kind
        run: |
          nix develop -c make docker-build
          nix develop -c kind load docker-image "$IMG" --name thecluster-operator

      - run: nix develop -c helm lint ./dist/chart

      - name: Install cert-manager
        run: |
          nix develop -c helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version "v$CERT_MANAGER_VERSION" \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true \
            --wait

      - name: Install chart
        run: |
          nix develop -c helm install thecluster-operator ./dist/chart \
            --namespace thecluster-operator-system --create-namespace \
            --set controllerManager.container.image.repository="${IMG%:*}" \
            --set controllerManager.container.image.tag="${IMG#*:}"
          nix develop -c helm status thecluster-operator --namespace thecluster-operator-system
