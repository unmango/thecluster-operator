---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: users.actions.thecluster.io
spec:
  group: actions.thecluster.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.login
      name: Login
      type: string
    - jsonPath: .spec.discover
      name: Discover
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          User is a GitHub user whose repositories get runner scale sets. It
          generates a Repository for each repository it selects and deletes the
          Repositories it generated once their repository is no longer selected.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of User
            properties:
              discover:
                description: |-
                  Discover adds every repository the user owns that the credentials can
                  see: the repositories a GitHub App installation was granted, or those a
                  token's owner owns.
                type: boolean
              exclude:
                description: |-
                  Exclude drops discovered repositories whose name matches one of these
                  globs, compared without regard to case. It wins over Include.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              include:
                description: |-
                  Include limits discovered repositories to those whose name matches one
                  of these globs, compared without regard to case. Empty includes all.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              includeArchived:
                description: IncludeArchived keeps archived repositories that discovery
                  finds.
                type: boolean
              includeForks:
                description: IncludeForks keeps forks that discovery finds.
                type: boolean
              interval:
                description: Interval is how often discovery runs again. Defaults
                  to 10m.
                type: string
              login:
                description: Login of the GitHub user, for example UnstoppableMango.
                maxLength: 39
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?$
                type: string
              repositories:
                description: |-
                  Repositories are names of the user's repositories that get runners
                  whether or not discovery finds them. Include, Exclude, and the archived
                  and fork switches do not apply to them.
                items:
                  pattern: ^[A-Za-z0-9._-]+$
                  type: string
                type: array
                x-kubernetes-list-type: set
              template:
                description: |-
                  Template is applied to every Repository the User generates. Its
                  GitHubConfigSecret is also what discovery authenticates with.
                properties:
                  githubConfigSecret:
                    description: |-
                      GitHubConfigSecret is the Secret holding the GitHub App or token the
                      scale set authenticates with. The operator copies it into Namespace,
                      since the scale set can only read a Secret in its own namespace.
                      Defaults to the operator's --github-config-secret.
                    properties:
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  listenerTemplate:
                    description: ListenerTemplate is passed to the AutoscalingRunnerSet
                      as is.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  maxRunners:
                    description: |-
                      MaxRunners caps how many runners run at once. Defaults to the
                      operator's --max-runners.
                    format: int32
                    minimum: 0
                    type: integer
                  minRunners:
                    description: MinRunners is how many idle runners to keep. Defaults
                      to none.
                    format: int32
                    minimum: 0
                    type: integer
                  nixStorageSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      NixStorageSize sizes the volume mounted at /nix in the default runner
                      template. Defaults to the operator's --nix-storage-size. Ignored when
                      Template is set.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  runnerGroup:
                    description: RunnerGroup the scale set joins. Omitted, it joins
                      the default group.
                    type: string
                  runnerScaleSetName:
                    description: |-
                      RunnerScaleSetName is the name the scale set registers under, the label
                      a workflow's runs-on selects. Defaults to the operator's
                      --runner-scale-set-name.
                    maxLength: 45
                    type: string
                  template:
                    description: Template replaces the default runner pod template
                      outright.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
                x-kubernetes-validations:
                - message: minRunners must not exceed maxRunners
                  rule: '!has(self.minRunners) || !has(self.maxRunners) || self.minRunners
                    <= self.maxRunners'
            required:
            - login
            type: object
          status:
            description: status defines the observed state of User
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflicts:
                description: |-
                  Conflicts are names of Repositories the User wanted but did not take
                  over, because something else created them first.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              lastDiscoveryTime:
                description: LastDiscoveryTime is when discovery last succeeded.
                format: date-time
                type: string
              repositories:
                description: Repositories are the names of the Repositories the User
                  generated.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
