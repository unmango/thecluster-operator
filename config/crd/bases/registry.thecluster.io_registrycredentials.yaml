      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RegistryCredential is a request for a login to one Project. The operator
          issues a robot scoped to that project and writes its secret into the
          secret store, where programs read it; nothing else hands it out.

          The stored secret is named <namespace>--<name>, holding the registry
          host, username and password as JSON. A name holds no "--" and neither
          starts nor ends with "-", which keeps that split unambiguous. It is
          lowercase because Key Vault compares names without case, and at 62
          characters the whole name fits Key Vault's 127.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RegistryCredentialSpec defines the desired state of RegistryCredential.
              It is immutable: a different login is a different RegistryCredential.
            properties:
              access:
                description: Access is pull, or push, which can also pull.
                enum:
                - pull
                - push
                type: string
              projectRef:
                description: |-
                  ProjectRef names the Project, in the same namespace, the credential
                  reaches. A credential cannot reach a project in another namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: name is required
                  rule: self.name != ''
            required:
            - access
            - projectRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: RegistryCredentialStatus defines the observed state of RegistryCredential.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
