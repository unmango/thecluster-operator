  names:
    kind: RegistryCredential
    listKind: RegistryCredentialList
    plural: registrycredentials
    singular: registrycredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.access
      name: Access
      type: string
    - jsonPath: .status.robot.expiresAt
