                    - github-ghcr
                    - quay
                    - docker-registry
                    type: string
                  url:
                    description: |-
                      URL of the upstream registry, for example https://hub.docker.com for
                      Docker Hub or https://registry.k8s.io.
                    pattern: ^https?://
                    type: string
                required:
